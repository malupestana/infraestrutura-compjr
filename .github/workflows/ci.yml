# Nome da pipeline
name: CI/CD Pipeline - Qualidade, Teste e Deploy

# Gatilhos
on:
  # Dispara em 'push' para a branch 'principal'
  push:
    branches: [ principal ]
  # Também dispara em 'pull request' para a branch 'principal'
  pull_request:
    branches: [ principal ]

# Define os trabalhos (Jobs)
jobs:
  # JOB 1: Testar e Analisar (O "CI" - Integração)
  test-and-analyze:
    name: Teste, Lint e Análise de Qualidade
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout 
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm ci

      # 4. Rodar os testes (JUnit)
      - name: Instalar JUnit Reporter
        run: npm install jest-junit --save-dev
      - name: Rodar os testes
        run: |
          chmod +x node_modules/.bin/jest
          npm run test -- --coverage --reporters=default --reporters=jest-junit
      # 5. Rodar Lint
      - name: Rodar Lint (ESLint)
        run: npm run lint

      # 6. Análise do SonarCloud (Atualizado para v6)
      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        
  # JOB 2: Fazer o Deploy (O "CD" - Entrega)
  deploy:
    name: Deploy para o Render
    needs: test-and-analyze

    # Só faz deploy se:
    # 1. O evento for um 'push' (e não um 'pull_request')
    # 2. A branch for a 'principal'
    if: github.event_name == 'push' && github.ref == 'refs/heads/principal'
    
    runs-on: ubuntu-latest

    steps:
      # 1. Disparar o Deploy Hook
      - name: Disparar Deploy no Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}